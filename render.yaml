databases:
  - name: catan-postgres
    plan: basic-256mb
    databaseName: catan
    user: catan
    diskSizeGB: 1

services:
  - type: web
    name: catan-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    disk:
      name: catan-persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: "Production"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: catan-postgres
          property: connectionString
      - key: Database__ApplyMigrations
        value: "true"
      - key: PersistentStorage__Path
        value: "/var/data"
      - key: DataProtection__ApplicationName
        value: "WebVibeTest-Catan-Production"
